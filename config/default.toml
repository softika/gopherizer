[app]
environment = "local"
name = "gopherizer"
version = "1.0.0"
# Log level: debug, info, warn or error. Leave empty to derive it from
# environment -- local and development log at debug, everything else at info.
# An unrecognised value fails at startup.
log_level = ""

[http]
host = "0.0.0.0"
port = 8080
read_timeout = "2m"
read_header_timeout = "10s"
write_timeout = "2m"
idle_timeout = "2m"
# Per-request deadline. Layered inside write_timeout and outside the database
# statement_timeout, so the innermost limit fires first and the error names the
# real cause. A request that exceeds it is answered 503.
request_timeout = "30s"
# Maximum request body, in bytes. 1 MiB. Zero disables the limit and leaves the
# process open to trivial memory exhaustion.
max_body_bytes = 1048576

[http.rate_limit]
requests = 100
window = "1m"

# How the caller's IP is resolved for rate limiting.
#   "remote_addr" - direct connections; proxy headers ignored (default)
#   "xff"         - behind `trusted_proxies` reverse proxies; uses X-Forwarded-For
#   "header"      - a proxy-set header named by `trusted_header`
[http.client_ip]
from = "remote_addr"
trusted_proxies = 0
trusted_header = ""

# Prometheus endpoint. Restrict this at the ingress; it is not authenticated.
[http.metrics]
enabled = true
path = "/metrics"

[http.cors]
origins = "*"
methods = "HEAD,GET,POST,PUT,PATCH,DELETE"
headers = "Content-Type,Content-Length"

[database]
host = "localhost"
port = 5432
user = "postgres"
password = "password"
dbname = "gopher"
sslmode_disabled = true
# Pool sizing. Left unset, pgx derives max_conns from the host CPU count, so the
# same image gets a different ceiling on every machine size. Postgres has a
# global connection limit that every service draws from, so state the share.
max_conns = 10
min_conns = 2
max_conn_lifetime = "1h"
max_conn_idle_time = "30m"
health_check_period = "1m"
# Applied by Postgres, so a runaway query is cancelled server-side instead of
# holding a pooled connection until the HTTP write deadline. Migrations share
# this setting -- raise it if yours run longer.
statement_timeout = "15s"
# OpenTelemetry trace export. Disabled by default so the template runs without
# a collector; `docker compose --profile observability up` starts one.
[tracing]
enabled = false
endpoint = "localhost:4318"
insecure = true
sample_ratio = 1.0
