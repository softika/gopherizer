name: Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2. Pinned to a minor version: the action resolves the
          # latest matching patch release. Installed as a binary (the default),
          # which is the mode upstream recommends over `goinstall`.
          version: v2.13

          # By default, the `.golangci.yml` file should be at the root of the repository.
          # The location of the configuration file can be changed by using `--config=`.
          # Note: `=` between a flag and its value is required, the action splits args on spaces.
          args: --timeout=30m

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          # only-new-issues: true
