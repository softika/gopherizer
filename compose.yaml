# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:

  # Backend API server.
  server:
    container_name: server
    build:
      context: .
      target: final
    command: ["serve"]
    # Startup fails when OIDC is on and the provider is not answering yet, and
    # Keycloak takes far longer to come up than discovery is willing to wait.
    # A restart policy is the right lever rather than a depends_on: keycloak is
    # gated behind the auth profile, so depending on it would either drag it
    # into the default stack or break profile validation.
    restart: unless-stopped
    environment:
      DATABASE_HOST: database
      HTTP_PORT: 8080
      # Tracing stays off unless asked for, so the default stack needs no
      # collector. `make observability` sets this to true.
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-tempo:4318}
      TRACING_INSECURE: "true"
      # Authentication stays off unless asked for, so the default stack needs
      # no identity provider. `make auth` sets this to true.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      # Must equal the `iss` the provider stamps into its tokens. The default
      # names the compose service, which is the address this container resolves
      # -- see KC_HOSTNAME on the keycloak service for the other half.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/gopherizer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-gopherizer-api}
      # Keycloak nests realm roles; the shipped default is deliberately vendor
      # neutral, so the provider-specific path is set here rather than there.
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-realm_access.roles}
      # The shipped realm issues RFC 9068 access tokens, so the strict check is
      # on in this example even though it ships off.
      OIDC_REQUIRE_TYPED_ACCESS_TOKEN: ${OIDC_REQUIRE_TYPED_ACCESS_TOKEN:-true}
    ports:
      - "8080:8080"
    networks:
      - gopher
    depends_on:
      database:
        condition: service_healthy

  # Database migration command.
  migration:
    container_name: migration
    build:
      context: .
      target: final
    command: ["migrate", "up"]
    environment:
      DATABASE_HOST: database
    networks:
      - gopher
    depends_on:
      database:
        condition: service_healthy

  # Postgres database.
  database:
    container_name: database
    image: postgres:18-alpine
    restart: always
    # secrets:
    # - db-password
    environment:
      POSTGRES_DB: gopher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the
      # mount belongs at /var/lib/postgresql rather than .../data. Mounting the
      # old path leaves it unused and the entrypoint refuses to start.
      # See https://github.com/docker-library/postgres/pull/1259
      - db_data:/var/lib/postgresql
    networks:
      - gopher
    healthcheck:
        test: ["CMD", "pg_isready", "-U", "postgres"]
        interval: 10s
        timeout: 5s
        retries: 5

  # ---------------------------------------------------------------------------
  # Observability stack.
  #
  # Behind a compose profile, so `make start` stays fast for anyone who only
  # wants the API and a database. Start it with `make observability`.
  # ---------------------------------------------------------------------------

  # Trace backend, receiving OTLP directly from the application. No collector
  # sits in between: Tempo accepts OTLP natively and one less moving part in a
  # template is worth more than the routing flexibility a collector would add.
  tempo:
    container_name: tempo
    image: grafana/tempo:2.10.8
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # query API
      - "4318:4318"   # OTLP/HTTP, used when the app runs on the host
    networks:
      - gopher

  # Metrics store. Exemplar storage is opt-in and off by default; without it
  # the trace ids attached to histogram samples are accepted and discarded.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # Lets the scrape reach an app running on the host via `make run`. Docker
    # Desktop resolves host.docker.internal already; Linux needs this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gopher

  # Dashboards, with Prometheus and Tempo provisioned and linked.
  grafana:
    container_name: grafana
    image: grafana/grafana:13.0.7
    profiles: [observability]
    environment:
      # Local development only: this removes the login entirely. Never carry
      # these settings into a deployed Grafana.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      # Datasources and the dashboard provider.
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON, read at startup and rescanned periodically.
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - gopher



  # Identity provider, for local development only.
  #
  # Behind a profile so the default stack stays a database and an application:
  # `make auth` starts it, plain `make start` does not.
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5
    profiles: [auth]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Keycloak stamps `iss` from this value, so it alone decides which side of
      # the network can verify a token -- the usual reason a working setup
      # rejects every token with "issuer did not match".
      #
      # The default names the compose service, which is what the server
      # container resolves. Keycloak still listens on localhost:8081, so a token
      # fetched from the host carries this same issuer and both sides agree with
      # no /etc/hosts edit. Run `make auth-host` for the reverse arrangement,
      # where the application runs on the host via `make run`.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://keycloak:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/auth/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - gopher

volumes:
  db_data:

# secrets:
#   db-password:
#     file: db/password.txt
networks:
  gopher:
    driver: bridge